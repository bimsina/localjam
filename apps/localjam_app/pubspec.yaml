name: localjam_app
description: "Listen together, in sync, over local Wi-Fi — no internet, no accounts."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.12.2

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8

  # The embeddable LocalJam engine (re-exports localjam_net + localjam_audio).
  localjam_client:
    path: ../../packages/localjam_client

  # Declarative routing + a shell for the docked room bar, and OS-level
  # localjam:// deep links (custom schemes need this on desktop too).
  go_router: ^17.3.0
  app_links: ^6.4.1

  # Appearance preference (Light / Dark / System).
  shared_preferences: ^2.5.5

  qr_flutter: ^4.1.0
  file_selector: ^1.0.3
  permission_handler: ^13.0.1
  mobile_scanner: ^7.4.0

  # Share sheet for join links, and the brand mark rendered from assets/brand.
  share_plus: ^13.3.0
  flutter_svg: ^2.3.0

  # Settings → About: the shipped version read from the build rather than a
  # constant somebody has to remember to bump, and the repo link opened in a
  # browser rather than copied to the clipboard.
  package_info_plus: ^10.2.1
  url_launcher: ^6.3.2

  # Where picked songs are kept once the picker's temporary copy is gone.
  path_provider: ^2.1.6

# `bonsoir_darwin` 7.1.1's `broadcast.start` waits for the Bonjour daemon with a
# synchronous `DNSServiceProcessResult` on the platform main thread, which on
# Flutter's merged UI thread takes the whole app down when the daemon never
# answers. The vendored copy schedules the registration on a background queue
# instead — see packages/third_party/bonsoir_darwin/PATCHES.md. Overrides do not
# propagate, so every consumer that builds for Apple platforms repeats this.
dependency_overrides:
  bonsoir_darwin:
    path: ../../packages/third_party/bonsoir_darwin

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^6.0.0

  # Brand asset generators — see README.md ("Brand assets").
  flutter_launcher_icons: ^0.14.4
  flutter_native_splash: ^2.4.8

flutter:
  uses-material-design: true

  assets:
    - assets/brand/
    - assets/fonts/OFL.txt

    # The browser player a host serves to web guests (PROTOCOL.md §1.1):
    # apps/localjam_web's release build, put here by tool/build_web_guest.sh
    # and never committed — each directory holds only a committed .gitkeep
    # until the script runs, and the app builds (and its rooms serve the
    # built-in "install the app" page) without it. A directory entry takes
    # its own files and none of its subdirectories', so every directory of a
    # build that has files is listed (assets/assets/fonts/ is the page's own
    # Manrope); the script warns about any it copies that is not, and about
    # any listed here that the build no longer produces.
    - assets/web/
    - assets/web/assets/
    - assets/web/assets/assets/fonts/
    - assets/web/assets/fonts/
    - assets/web/assets/fonts/fallback/
    - assets/web/assets/packages/cupertino_icons/assets/
    - assets/web/assets/shaders/
    - assets/web/canvaskit/
    - assets/web/canvaskit/chromium/
    - assets/web/icons/

  fonts:
    - family: Manrope
      fonts:
        - asset: assets/fonts/Manrope.ttf

# App icon: the white "beamed signal" mark (two notes joined by Wi-Fi arcs)
# on the raspberry gradient. Every brand image comes from tool/render_brand.sh;
# run it first, then:
#   dart run flutter_launcher_icons
flutter_launcher_icons:
  image_path: "assets/brand/icon_1024.png"

  android: true
  min_sdk_android: 24
  adaptive_icon_background: "#D9366B"
  adaptive_icon_foreground: "assets/brand/icon_foreground.png"
  adaptive_icon_monochrome: "assets/brand/icon_monochrome.png"

  # App Store rejects icons with an alpha channel.
  ios: true
  remove_alpha_ios: true

  macos:
    generate: true
    image_path: "assets/brand/icon_1024.png"

  windows:
    generate: true
    image_path: "assets/brand/icon_1024.png"
    icon_size: 256

# Launch screen: system white (light) / black (dark) with the mark centred —
# raspberry on white, white on black (the same mark, recoloured).
#   dart run flutter_native_splash:create
flutter_native_splash:
  color: "#FFFFFF"
  color_dark: "#000000"
  image: assets/brand/splash_logo_light.png
  image_dark: assets/brand/splash_logo.png

  android: true
  ios: true
  web: false

  android_12:
    color: "#FFFFFF"
    color_dark: "#000000"
    image: assets/brand/splash_logo_android12_light.png
    image_dark: assets/brand/splash_logo_android12.png
