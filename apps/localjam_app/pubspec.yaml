name: localjam_app
description: "LocalJam — synchronized local-network audio playback."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.12.2

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8

  # The embeddable LocalJam engine (re-exports localjam_net + localjam_audio).
  localjam_client:
    path: ../../packages/localjam_client

  qr_flutter: ^4.1.0
  file_selector: ^1.0.3
  permission_handler: ^13.0.1
  mobile_scanner: ^7.4.0

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
