<!DOCTYPE html>
<html lang="en">
<head>
  <!--
    The host serves this page at /join (and /) and the bundle under /web/
    (PROTOCOL.md §1.1), so the build uses `--base-href /web/`. Nothing here
    may load from anywhere but this origin (docs/design/WEB_GUEST.md D8).
  -->
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="description" content="Listen along to a LocalJam from this browser.">
  <meta name="referrer" content="no-referrer">
  <meta name="color-scheme" content="light dark">
  <meta name="theme-color" content="#FAF8F5" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#1A1715" media="(prefers-color-scheme: dark)">

  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="LocalJam">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">
  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>LocalJam</title>
  <style>
    html, body { margin: 0; height: 100%; background: #FAF8F5; }
    @media (prefers-color-scheme: dark) {
      html, body { background: #1A1715; }
    }
  </style>
</head>
<body>
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
