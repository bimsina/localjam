name: localjam_cli
description: >-
  Two-terminal demo CLI for LocalJam: a host that serves media and a guest
  that joins over the LAN and runs a simulated, drift-corrected player.
version: 0.1.0
publish_to: none

environment:
  sdk: ^3.12.2

executables:
  localjam:

dependencies:
  args: ^2.6.0
  localjam_core:
    path: ../../packages/localjam_core
  localjam_net:
    path: ../../packages/localjam_net

dev_dependencies:
  lints: ^6.0.0
  test: ^1.25.6
