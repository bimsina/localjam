org.gradle.jvmargs=-Xmx8G -XX:MaxMetaspaceSize=4G -XX:ReservedCodeCacheSize=512m -XX:+HeapDumpOnOutOfMemoryError
android.useAndroidX=true
# AGP 9's own DSL and built-in Kotlin (AGP compiles Kotlin; no plugin applies
# the Kotlin Gradle Plugin). Both are AGP 9's defaults, but they stay spelled
# out: the Flutter tool writes `=false` for any of the two it finds missing.
# https://docs.flutter.dev/release/breaking-changes/migrate-to-built-in-kotlin
android.newDsl=true
android.builtInKotlin=true
