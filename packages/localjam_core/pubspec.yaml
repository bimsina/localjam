name: localjam_core
description: >-
  Pure-Dart core of the LocalJam protocol: message types and codec,
  NTP-style clock sync, permissions, and the anchor playback state machine.
  No I/O.
version: 0.2.0
publish_to: none

environment:
  sdk: ^3.12.2

dependencies:
  meta: ">=1.18.0 <2.0.0"

dev_dependencies:
  lints: ^6.0.0
  test: ^1.25.6
