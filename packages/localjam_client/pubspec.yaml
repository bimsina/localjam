name: localjam_client
description: "The embeddable LocalJam client engine: host and guest playback engines wrapping localjam_net transport and localjam_audio scheduled playback behind one API."
version: 0.1.0
publish_to: 'none'

environment:
  sdk: ^3.12.2
  flutter: ">=1.17.0"

dependencies:
  flutter:
    sdk: flutter
  # LocalJam protocol transport (re-exports localjam_core).
  localjam_net:
    path: ../localjam_net
  # Pinned scheduled-audio plugin API (native side developed in parallel).
  localjam_audio:
    path: ../localjam_audio
  # Default guest media cache directory.
  path_provider: ^2.1.4
  # Manual sync-nudge persistence (PROTOCOL.md §7).
  shared_preferences: ^2.3.2
  bonsoir: ^7.1.5
  # The browser guest's `blob:` URLs for prefetched media (media_store_memory).
  web: ^1.1.0

# `bonsoir_darwin` 7.1.1's `broadcast.start` waits for the Bonjour daemon with a
# synchronous `DNSServiceProcessResult` on the platform main thread, which on
# Flutter's merged UI thread takes the whole app down when the daemon never
# answers. The vendored copy schedules the registration on a background queue
# instead — see packages/third_party/bonsoir_darwin/PATCHES.md. Overrides do not
# propagate, so every consumer that builds for Apple platforms repeats this.
dependency_overrides:
  bonsoir_darwin:
    path: ../third_party/bonsoir_darwin

dev_dependencies:
  flutter_test:
    sdk: flutter
  fake_async: ^1.3.1
  flutter_lints: ^6.0.0
  audio_metadata_reader: ^1.7.1
  # The identity tests stand a fake prefs store in front of the plugin, to
  # hold a cold start's channel at arm's length.
  shared_preferences_platform_interface: ^2.4.1

flutter:
