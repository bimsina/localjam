name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

env:
  FLUTTER_VERSION: 3.47.5
  # The Dart SDK that FLUTTER_VERSION ships, for the pure-Dart jobs.
  DART_VERSION: 3.13.4

jobs:
  # Pure Dart: no Flutter SDK, no platform toolchain, so these are cheap.
  dart:
    name: dart · ${{ matrix.package }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        package:
          - packages/localjam_core
          - packages/localjam_net
          - apps/localjam_cli
    steps:
      - uses: actions/checkout@v4
      - uses: dart-lang/setup-dart@v1
        with:
          sdk: ${{ env.DART_VERSION }}
      - run: dart pub get
        working-directory: ${{ matrix.package }}
      - run: dart format --output=none --set-exit-if-changed .
        working-directory: ${{ matrix.package }}
      - run: dart analyze
        working-directory: ${{ matrix.package }}
      - run: dart test
        working-directory: ${{ matrix.package }}

  # Flutter packages. macOS because localjam_audio and the app pull in Darwin
  # plugin code (including the vendored bonsoir_darwin) that only resolves here.
  flutter:
    name: flutter · ${{ matrix.package }}
    runs-on: macos-latest
    strategy:
      fail-fast: false
      matrix:
        package:
          - packages/localjam_client
          - packages/localjam_audio
          - apps/localjam_app
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - run: flutter pub get
        working-directory: ${{ matrix.package }}
      - run: dart format --output=none --set-exit-if-changed .
        working-directory: ${{ matrix.package }}
      - run: flutter analyze
        working-directory: ${{ matrix.package }}
      - run: flutter test
        working-directory: ${{ matrix.package }}

  # JVM unit tests of the Android plugin (packages/localjam_audio/android/
  # src/test): the scheduling, latency, focus, route and speed policies. A
  # plugin has no Gradle wrapper of its own, so they run as the
  # :localjam_audio subproject of the example app; `--config-only` generates
  # that app's gradlew and local.properties without building it.
  kotlin-tests:
    name: kotlin · localjam_audio unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - run: flutter pub get
        working-directory: packages/localjam_audio/example
      - run: flutter build apk --config-only
        working-directory: packages/localjam_audio/example
      - run: ./gradlew :localjam_audio:testDebugUnitTest
        working-directory: packages/localjam_audio/example/android

  build-apple:
    name: build · android + ios simulator
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - run: flutter pub get
        working-directory: apps/localjam_app
      # Debug, unsigned: release signing needs android/key.properties, which is
      # git-ignored (see apps/localjam_app/README.md).
      - run: flutter build apk --debug
        working-directory: apps/localjam_app
      - run: flutter build ios --simulator --no-codesign
        working-directory: apps/localjam_app

  build-linux:
    name: build · linux
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # GTK is the only library the plugin links: miniaudio dlopen()s
      # ALSA/PulseAudio/JACK at runtime, so no audio -dev package is needed to
      # build (see packages/localjam_audio/linux/CMakeLists.txt).
      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            clang cmake ninja-build pkg-config libgtk-3-dev
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - run: flutter pub get
        working-directory: apps/localjam_app
      - run: flutter build linux --debug
        working-directory: apps/localjam_app
