name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

env:
  FLUTTER_VERSION: 3.47.9
  # The Dart SDK that FLUTTER_VERSION ships, for the pure-Dart jobs.
  DART_VERSION: 3.13.7

jobs:
  # Pure Dart: no Flutter SDK, no platform toolchain, so these are cheap.
  dart:
    name: dart · ${{ matrix.package }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        package:
          - packages/localjam_core
          - packages/localjam_net
          - apps/localjam_cli
    steps:
      - uses: actions/checkout@v4
      - uses: dart-lang/setup-dart@v1
        with:
          sdk: ${{ env.DART_VERSION }}
      - run: dart pub get
        working-directory: ${{ matrix.package }}
      - run: dart format --output=none --set-exit-if-changed .
        working-directory: ${{ matrix.package }}
      - run: dart analyze --fatal-infos
        working-directory: ${{ matrix.package }}
      - run: dart test
        working-directory: ${{ matrix.package }}

  # Flutter packages. macOS because localjam_audio and the app pull in Darwin
  # plugin code (including the vendored bonsoir_darwin) that only resolves here.
  # Tests run on a clean checkout: no test-media/, and no built web player in
  # apps/localjam_app/assets/web/ (only the committed .gitkeep placeholders).
  flutter:
    name: flutter · ${{ matrix.package }}
    runs-on: macos-latest
    strategy:
      fail-fast: false
      matrix:
        package:
          - packages/localjam_client
          - packages/localjam_audio
          - apps/localjam_app
          - apps/localjam_web
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - run: flutter pub get
        working-directory: ${{ matrix.package }}
      - run: dart format --output=none --set-exit-if-changed .
        working-directory: ${{ matrix.package }}
      - run: flutter analyze --fatal-infos
        working-directory: ${{ matrix.package }}
      - run: flutter test
        working-directory: ${{ matrix.package }}

  # The Android release: the browser player built and bundled first
  # (tool/build_web_guest.sh; its output is git-ignored, so a clean checkout
  # has only the .gitkeep placeholders), then the APK and the App Bundle.
  # Without android/key.properties (git-ignored) Gradle signs the release
  # with the debug key and says so; store signing happens on the release
  # machine, so these artifacts are for testing only.
  build-android:
    name: build · android release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - run: tool/build_web_guest.sh
      # The script promises a build leaves the tree clean (output ignored,
      # placeholders put back).
      - name: The web player build left the checkout clean
        run: test -z "$(git status --porcelain)" || { git status; exit 1; }
      - run: flutter pub get
        working-directory: apps/localjam_app
      # No signing secrets in CI: release builds refuse the debug key unless
      # this opt-in is set (see docs/release/ANDROID_RELEASE.md).
      - run: flutter build apk --release
        env:
          LOCALJAM_ALLOW_DEBUG_SIGNING: '1'
        working-directory: apps/localjam_app
      - run: flutter build appbundle --release
        env:
          LOCALJAM_ALLOW_DEBUG_SIGNING: '1'
        working-directory: apps/localjam_app
      - uses: actions/upload-artifact@v4
        with:
          name: localjam-android-debug-signed
          path: |
            apps/localjam_app/build/app/outputs/flutter-apk/app-release.apk
            apps/localjam_app/build/app/outputs/bundle/release/app-release.aab
          retention-days: 7

  # Built without the web player: the app must build (its rooms then serve
  # the built-in "install the app" page) with only the placeholders.
  build-ios:
    name: build · ios simulator
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - run: flutter pub get
        working-directory: apps/localjam_app
      - run: flutter build ios --simulator --no-codesign
        working-directory: apps/localjam_app

  build-linux:
    name: build · linux
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # GTK is the only library the plugin links: miniaudio dlopen()s
      # ALSA/PulseAudio/JACK at runtime, so no audio -dev package is needed to
      # build (see packages/localjam_audio/linux/CMakeLists.txt).
      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            clang cmake ninja-build pkg-config libgtk-3-dev
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - run: flutter pub get
        working-directory: apps/localjam_app
      - run: flutter build linux --debug
        working-directory: apps/localjam_app
