name: Release

# Push a tag `vX.Y.Z` that matches `version:` in apps/localjam_app/pubspec.yaml
# and this builds Android, macOS, Linux and Windows and attaches them to a
# DRAFT GitHub release: nothing is public until the draft is published by hand.
# `workflow_dispatch` runs the same builds without a tag and without a
# release, to try the pipeline (artifacts stay on the workflow run).
#
# Android signing needs four repository secrets (docs/release/ANDROID_RELEASE.md):
#   ANDROID_KEYSTORE_BASE64   base64 of the .jks
#   ANDROID_KEYSTORE_PASSWORD
#   ANDROID_KEY_ALIAS
#   ANDROID_KEY_PASSWORD
# A tagged build without them fails rather than publish a debug-signed APK.

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  FLUTTER_VERSION: 3.50.0

jobs:
  # The tag is the version: a mismatch would publish binaries that report a
  # different version than the release they hang from.
  version:
    name: check · tag matches pubspec
    runs-on: ubuntu-latest
    outputs:
      name: ${{ steps.v.outputs.name }}
    steps:
      - uses: actions/checkout@v4
      - id: v
        run: |
          name="$(sed -n -E 's/^version:[[:space:]]*([^+[:space:]]+).*/\1/p' apps/localjam_app/pubspec.yaml)"
          [[ -n "$name" ]] || { echo "no version in pubspec.yaml" >&2; exit 1; }
          if [[ "$GITHUB_REF_TYPE" == "tag" && "$GITHUB_REF_NAME" != "v$name" ]]; then
            echo "tag $GITHUB_REF_NAME does not match pubspec version $name" >&2
            exit 1
          fi
          echo "name=$name" >>"$GITHUB_OUTPUT"

  # The browser player every host serves to web guests. Built once here and
  # handed to each platform, so the Windows job needs no bash tooling and all
  # four apps carry the same player.
  web-player:
    name: build · web player
    needs: version
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - run: tool/build_web_guest.sh
      - uses: actions/upload-artifact@v4
        with:
          name: web-player
          path: apps/localjam_app/assets/web/
          if-no-files-found: error
          retention-days: 1

  android:
    name: build · android
    needs: [version, web-player]
    runs-on: ubuntu-latest
    env:
      KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - uses: actions/download-artifact@v4
        with:
          name: web-player
          path: apps/localjam_app/assets/web/
      - run: tool/build_web_guest.sh --check
      - name: Install the upload keystore
        if: env.KEYSTORE_BASE64 != ''
        env:
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          umask 077
          printf '%s' "$KEYSTORE_BASE64" | base64 -d >"$RUNNER_TEMP/upload.jks"
          {
            echo "storeFile=$RUNNER_TEMP/upload.jks"
            echo "storePassword=$KEYSTORE_PASSWORD"
            echo "keyAlias=$KEY_ALIAS"
            echo "keyPassword=$KEY_PASSWORD"
          } >apps/localjam_app/android/key.properties
      - name: Refuse to tag a debug-signed release
        if: env.KEYSTORE_BASE64 == '' && github.ref_type == 'tag'
        run: |
          echo "ANDROID_KEYSTORE_BASE64 is not set: a tagged release must be signed." >&2
          exit 1
      - run: flutter pub get
        working-directory: apps/localjam_app
      # Without the keystore (a manual dry run) the debug key is used, and the
      # file name says so.
      - run: flutter build apk --release
        env:
          LOCALJAM_ALLOW_DEBUG_SIGNING: ${{ env.KEYSTORE_BASE64 == '' && '1' || '' }}
        working-directory: apps/localjam_app
      - run: flutter build appbundle --release
        env:
          LOCALJAM_ALLOW_DEBUG_SIGNING: ${{ env.KEYSTORE_BASE64 == '' && '1' || '' }}
        working-directory: apps/localjam_app
      - name: Collect
        run: |
          suffix=""
          [[ -n "$KEYSTORE_BASE64" ]] || suffix="-DEBUG-SIGNED"
          mkdir dist
          cp apps/localjam_app/build/app/outputs/flutter-apk/app-release.apk \
            "dist/LocalJam-${{ needs.version.outputs.name }}-android$suffix.apk"
          cp apps/localjam_app/build/app/outputs/bundle/release/app-release.aab \
            "dist/LocalJam-${{ needs.version.outputs.name }}-android$suffix.aab"
      - name: Remove the keystore
        if: always()
        run: rm -f "$RUNNER_TEMP/upload.jks" apps/localjam_app/android/key.properties
      # The APK is the download; the App Bundle is for Play and stays on the
      # workflow run.
      - uses: actions/upload-artifact@v4
        with:
          name: dist-android
          path: dist/*.apk
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        with:
          name: play-bundle
          path: dist/*.aab
          if-no-files-found: error
          retention-days: 14

  # Ad-hoc signed (CODE_SIGN_IDENTITY "-"), not notarized: Gatekeeper asks
  # the user to allow it on first launch. The release notes say so.
  macos:
    name: build · macos
    needs: [version, web-player]
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - uses: actions/download-artifact@v4
        with:
          name: web-player
          path: apps/localjam_app/assets/web/
      - run: tool/build_web_guest.sh --check
      - run: flutter pub get
        working-directory: apps/localjam_app
      - run: flutter build macos --release
        working-directory: apps/localjam_app
      - name: Collect
        run: |
          mkdir dist
          app="$(find apps/localjam_app/build/macos/Build/Products/Release -maxdepth 1 -name '*.app' | head -n 1)"
          [[ -d "$app" ]] || { echo "no .app in the build output" >&2; exit 1; }
          ditto -c -k --sequesterRsrc --keepParent "$app" \
            "dist/LocalJam-${{ needs.version.outputs.name }}-macos.zip"
      - uses: actions/upload-artifact@v4
        with:
          name: dist-macos
          path: dist/*
          if-no-files-found: error

  linux:
    name: build · linux
    needs: [version, web-player]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            clang cmake ninja-build pkg-config libgtk-3-dev
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - uses: actions/download-artifact@v4
        with:
          name: web-player
          path: apps/localjam_app/assets/web/
      - run: tool/build_web_guest.sh --check
      - run: flutter pub get
        working-directory: apps/localjam_app
      - run: flutter build linux --release
        working-directory: apps/localjam_app
      - name: Collect
        run: |
          mkdir dist
          name="LocalJam-${{ needs.version.outputs.name }}-linux-x64"
          cp -R apps/localjam_app/build/linux/x64/release/bundle "$name"
          tar -czf "dist/$name.tar.gz" "$name"
      - uses: actions/upload-artifact@v4
        with:
          name: dist-linux
          path: dist/*
          if-no-files-found: error

  windows:
    name: build · windows
    needs: [version, web-player]
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - uses: actions/download-artifact@v4
        with:
          name: web-player
          path: apps/localjam_app/assets/web/
      - run: tool/build_web_guest.sh --check
        shell: bash
      - run: flutter pub get
        working-directory: apps/localjam_app
      - run: flutter build windows --release
        working-directory: apps/localjam_app
      - name: Collect
        shell: pwsh
        run: |
          New-Item -ItemType Directory dist | Out-Null
          $name = "LocalJam-${{ needs.version.outputs.name }}-windows-x64"
          Copy-Item -Recurse apps/localjam_app/build/windows/x64/runner/Release $name
          Compress-Archive -Path $name -DestinationPath "dist/$name.zip"
      - uses: actions/upload-artifact@v4
        with:
          name: dist-windows
          path: dist/*
          if-no-files-found: error

  # Android is the release; a desktop build that fails is left out of the
  # draft rather than holding it back (Windows and Linux are experimental,
  # see README "Platforms"). Check the draft's files before publishing it.
  publish:
    name: draft release
    if: ${{ !cancelled() && github.ref_type == 'tag' && needs.android.result == 'success' }}
    needs: [version, android, macos, linux, windows]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: dist-*
          path: dist
          merge-multiple: true
      - name: Checksums
        working-directory: dist
        run: sha256sum * >SHA256SUMS.txt
      - name: Create the draft
        env:
          GH_TOKEN: ${{ github.token }}
          RESULTS: >-
            macOS ${{ needs.macos.result }},
            Linux ${{ needs.linux.result }},
            Windows ${{ needs.windows.result }}
        run: |
          {
            echo "See [CHANGELOG.md](https://github.com/$GITHUB_REPOSITORY/blob/$GITHUB_REF_NAME/CHANGELOG.md)."
            echo
            echo "- **Android**: install the \`.apk\`. It is signed with a different key than the Google Play build, so the two cannot update each other: uninstall one before installing the other."
            echo "- **macOS**: unzip and move LocalJam to Applications. The build is not notarized: the first time, right-click the app and choose Open."
            echo "- **Linux / Windows**: experimental. Unpack and run \`localjam_app\`. They play mp3, flac, wav and ogg (no m4a/AAC)."
            echo
            echo "Desktop builds in this run: $RESULTS."
          } >notes.md
          gh release create "$GITHUB_REF_NAME" dist/* \
            --draft --verify-tag \
            --title "LocalJam ${{ needs.version.outputs.name }}" \
            --notes-file notes.md
